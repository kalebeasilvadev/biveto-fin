version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: biveto_postgres
    environment:
      POSTGRES_USER: biveto
      POSTGRES_PASSWORD: biveto_secret
      POSTGRES_DB: biveto_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biveto -d biveto_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Limitar recursos para evitar consumo excessivo
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_data:
    name: biveto_postgres_data
