version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: financeiro_postgres
    environment:
      POSTGRES_USER: financeiro
      POSTGRES_PASSWORD: financeiro_secret
      POSTGRES_DB: financeiro_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeiro -d financeiro_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Limitar recursos para evitar consumo excessivo
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_data:
    name: financeiro_postgres_data
