<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F"/>
      <stop offset="100%" style="stop-color:#102a43"/>
    </linearGradient>
  </defs>

  <!-- Icon container -->
  <rect x="0" y="0" width="60" height="60" rx="12" fill="url(#iconGradient)"/>

  <!-- B with bars -->
  <g fill="white">
    <!-- Left bar -->
    <rect x="12" y="12" width="8" height="36" rx="2"/>
    <!-- Top bar -->
    <rect x="22" y="12" width="16" height="8" rx="2"/>
    <!-- Middle bar -->
    <rect x="22" y="26" width="20" height="8" rx="2"/>
    <!-- Bottom bar -->
    <rect x="22" y="40" width="24" height="8" rx="2"/>
    <!-- Connectors -->
    <rect x="34" y="18" width="6" height="10" rx="1"/>
    <rect x="38" y="32" width="6" height="10" rx="1"/>
  </g>

  <!-- Green dot -->
  <circle cx="50" cy="14" r="6" fill="#4ade80"/>
</svg>
