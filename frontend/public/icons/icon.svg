<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F"/>
      <stop offset="100%" style="stop-color:#102a43"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Stylized B with chart bars -->
  <g fill="white">
    <!-- Left vertical bar of B -->
    <rect x="120" y="120" width="50" height="272" rx="8"/>

    <!-- Chart bars (right side, forming B shape) -->
    <!-- Top bar (shortest) -->
    <rect x="190" y="120" width="120" height="50" rx="8"/>
    <!-- Middle bar -->
    <rect x="190" y="231" width="160" height="50" rx="8"/>
    <!-- Bottom bar (longest) -->
    <rect x="190" y="342" width="180" height="50" rx="8"/>

    <!-- Curved connections for B -->
    <rect x="290" y="145" width="50" height="90" rx="8"/>
    <rect x="330" y="260" width="50" height="90" rx="8"/>
  </g>

  <!-- Green accent dot -->
  <circle cx="400" cy="130" r="32" fill="#4ade80"/>
</svg>
