    <!-- Left bar -->
    <rect x="38" y="38" width="26" height="116" rx="6"/>
    <!-- Top bar -->
    <rect x="70" y="38" width="52" height="26" rx="6"/>
    <!-- Middle bar -->
    <rect x="70" y="83" width="64" height="26" rx="6"/>
    <!-- Bottom bar -->
    <rect x="70" y="128" width="78" height="26" rx="6"/>
    <!-- Connectors -->
    <rect x="112" y="58" width="20" height="32" rx="3"/>
    <rect x="124" y="103" width="20" height="32" rx="3"/>
  </g>

  <!-- Green dot -->
  <circle cx="160" cy="45" r="20" fill="#4ade80"/>
