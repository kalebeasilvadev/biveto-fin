<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F"/>
      <stop offset="100%" style="stop-color:#102a43"/>
    </linearGradient>
  </defs>

  <!-- Icon container -->
  <rect x="0" y="5" width="50" height="50" rx="10" fill="url(#logoGradient)"/>

  <!-- B with bars -->
  <g fill="white">
    <!-- Left bar -->
    <rect x="10" y="14" width="6" height="32" rx="1"/>
    <!-- Top bar -->
    <rect x="18" y="14" width="14" height="6" rx="1"/>
    <!-- Middle bar -->
    <rect x="18" y="27" width="18" height="6" rx="1"/>
    <!-- Bottom bar -->
    <rect x="18" y="40" width="22" height="6" rx="1"/>
    <!-- Connectors -->
    <rect x="28" y="18" width="6" height="11" rx="1"/>
    <rect x="32" y="31" width="6" height="11" rx="1"/>
  </g>

  <!-- Green dot -->
  <circle cx="44" cy="12" r="5" fill="#4ade80"/>

  <!-- Text "Biveto" -->
  <text x="60" y="40" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#1E3A5F">Biveto</text>
</svg>
