<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="favGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F"/>
      <stop offset="100%" style="stop-color:#102a43"/>
    </linearGradient>
  </defs>

  <!-- Icon container -->
  <rect x="0" y="0" width="32" height="32" rx="6" fill="url(#favGradient)"/>

  <!-- B with bars -->
  <g fill="white">
    <!-- Left bar -->
    <rect x="6" y="6" width="4" height="20" rx="1"/>
    <!-- Top bar -->
    <rect x="11" y="6" width="9" height="4" rx="1"/>
    <!-- Middle bar -->
    <rect x="11" y="14" width="11" height="4" rx="1"/>
    <!-- Bottom bar -->
    <rect x="11" y="22" width="13" height="4" rx="1"/>
    <!-- Connectors -->
    <rect x="18" y="9" width="3" height="6" rx="0.5"/>
    <rect x="20" y="17" width="3" height="6" rx="0.5"/>
  </g>

  <!-- Green dot -->
  <circle cx="27" cy="7" r="3" fill="#4ade80"/>
</svg>
