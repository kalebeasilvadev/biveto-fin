# fly.toml - Backend configuration for Fly.io
# App name should be unique - change if needed

app = "app-financeiro"
primary_region = "gru"  # Sao Paulo, Brazil

[build]
  dockerfile = "backend/Dockerfile"

[env]
  ENVIRONMENT = "production"
  DEBUG = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "20s"
  grace_period = "60s"
  method = "GET"
  path = "/health"

[mounts]
  source = "app_data"
  destination = "/app/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
